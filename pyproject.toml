[project]
name = "medical-image-processing"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dicom2nifti>=2.6.2",
    "dipy>=1.12.1",
    "matplotlib>=3.11.1",
    "nibabel>=5.4.2",
    "numpy>=2.5.1",
    "pandas>=3.0.5",
    "pydicom>=3.0.2",
    "regex>=2026.7.19",
    "scikit-image>=0.26.0",
    "simpleitk>=2.5.5",
    "tcia-utils>=3.3.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/medio", "src/denoise", "src/edges", "src/mathmorpho"]

[tool.ruff]
# Longueur maximale des lignes (88 est la valeur par défaut de Black et Ruff)
line-length = 100

[tool.ruff.lint]
# Active les règles de base de Ruff (E = Syntax errors, F = Pyflakes) + I (isort)
select = ["E", "F", "I"]
ignore = []

[dependency-groups]
dev = [
    "ruff>=0.16.0",
]
