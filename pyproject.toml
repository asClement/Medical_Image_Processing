[project]
name = "medical-image-processing"
version = "0.1.0"
description = "Boîte à outils de traitement et segmentation d'images médicales 3D (NIfTI)"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Medical Image Processing contributors" }]
keywords = [
    "medical-imaging", "segmentation", "nifti", "morphology",
    "denoising", "edge-detection", "preprocessing", "mri",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "dicom2nifti>=2.6.2",
    "dipy>=1.12.1",
    "matplotlib>=3.11.1",
    "nibabel>=5.4.2",
    "numpy>=2.5.1",
    "pandas>=3.0.5",
    "pydicom>=3.0.2",
    "regex>=2026.7.19",
    "scikit-image>=0.26.0",
    "scikit-learn>=1.0",
    "scipy>=1.7",
    "simpleitk>=2.5.5",
    "tcia-utils>=3.3.4",
    "tqdm>=4.62",
]

[project.optional-dependencies]
fuzzy = ["scikit-fuzzy>=0.4.2"]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff>=0.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/medio", "src/denoise", "src/edges", "src/mathmorpho",
            "src/segmed3d", "src/utils", "src/preprocessing.py"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "ruff>=0.16.0",
]
