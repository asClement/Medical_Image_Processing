[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mathmorpho"
version = "0.2.1"
description = "Morphologie mathématique 3D pour le prétraitement d'images IRM (NIfTI) en imagerie tumorale."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "A definir" }
]
keywords = [
    "morphologie mathematique",
    "IRM",
    "NIfTI",
    "imagerie medicale",
    "segmentation",
    "tumeur",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "scikit-image>=0.20",
    "nibabel>=4.0",
    "matplotlib>=3.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]

[tool.hatch.build.targets.wheel]
packages = ["mathmorpho"]
