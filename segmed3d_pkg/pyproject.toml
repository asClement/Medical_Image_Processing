[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "segmed3d"
version = "0.1.0"
description = "Mathematical morphology & segmentation library for 3D medical images (NIfTI)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "segmed3d contributors" }]
keywords = [
    "medical-imaging",
    "segmentation",
    "nifti",
    "morphology",
    "3d",
    "tumor",
    "brain",
    "otsu",
    "watershed",
    "active-contour",
    "level-set",
    "region-growing",
    "kmeans",
    "multi-atlas",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "scikit-image>=0.19",
    "scikit-learn>=1.0",
    "nibabel>=3.2",
    "SimpleITK>=2.1",
    "matplotlib>=3.5",
    "tqdm>=4.62",
]

[project.optional-dependencies]
fuzzy = ["scikit-fuzzy>=0.4.2"]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff",
    "black",
    "scikit-fuzzy>=0.4.2",
]

[project.urls]
Homepage = "https://github.com/segmed3d/segmed3d"
Repository = "https://github.com/segmed3d/segmed3d"
Issues = "https://github.com/segmed3d/segmed3d/issues"

[tool.setuptools.packages.find]
include = ["segmed3d*"]

[tool.setuptools.package-data]
segmed3d = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.black]
line-length = 100
target-version = ["py38"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
